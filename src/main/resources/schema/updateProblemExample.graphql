extend type Mutation {
  """Updates a public example on a published problem. Admins only."""
  updateProblemExample(input: UpdateProblemExampleInput!): UpdateProblemExampleResult!
}

union UpdateProblemExampleResult =
    UpdateProblemExampleSuccess
  | ProblemValidationFailure
  | ProblemNotFound
  | ProblemForbidden

type UpdateProblemExampleSuccess {
  example: ProblemExample!
}

"""Omitted fields stay unchanged."""
input UpdateProblemExampleInput {
  """Opaque public-example ID returned by ProblemExample.id."""
  id: ID!

  """Serialized JSON input. Omit or provide GraphQL null to leave unchanged; the string "null" stores a JSON null value."""
  inputJson: String

  """Serialized JSON expectation. Omit or provide GraphQL null to leave unchanged; the string "null" stores a JSON null value."""
  expectedOutputJson: String

  """Omit to leave unchanged, provide text to update, or provide null to clear the explanation."""
  explanationMarkdown: String
}
