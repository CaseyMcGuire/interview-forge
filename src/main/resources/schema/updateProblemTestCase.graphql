extend type Mutation {
  """Updates a test case. Admins only."""
  updateProblemTestCase(input: UpdateProblemTestCaseInput!): UpdateProblemTestCaseResult!
}

union UpdateProblemTestCaseResult =
    UpdateProblemTestCaseSuccess
  | ProblemValidationFailure
  | ProblemNotFound
  | ProblemForbidden

type UpdateProblemTestCaseSuccess {
  testCase: ProblemTestCase!
}

"""Replaces the test's content while preserving its position and visibility."""
input UpdateProblemTestCaseInput {
  id: ID!

  """Serialized JSON input, at most 20,000 characters when compactly serialized."""
  inputJson: String!

  """
  Serialized JSON expectation, at most 20,000 characters when compactly serialized.
  The string "null" is a valid expected value.
  """
  expectedOutputJson: String!

  """Optional Markdown explanation, at most 10,000 characters. Omit or pass null to clear."""
  explanationMarkdown: String
}
