extend type Query {
  """
  Polls a persisted official submission belonging to the signed-in user, including after
  its problem is edited or archived. Returns null for unauthenticated viewers, malformed
  or wrong-type IDs, missing submissions, other users' submissions, and non-official attempts.
  """
  submission(id: ID!): Submission
}

"""A persisted official submission and its progress, visible only to its authenticated owner."""
type Submission {
  """Opaque, globally unique identifier used for polling."""
  id: ID!

  status: SubmissionStatus!

  """Null until FINISHED, then always present. ACCEPTED means the official suite passed."""
  verdict: SubmissionVerdict

  """Zero while queued; set when the worker selects the official suite."""
  totalCases: Int!

  """Number of official cases passed so far."""
  passedCases: Int!

  """Sum of available case runtimes in milliseconds, excluding compilation; null if unavailable."""
  runtimeMs: Int

  """Highest available case memory measurement in megabytes; null if unavailable."""
  peakMemoryMb: Int

  """Safe failure explanation, at most 20,000 characters. Excludes hidden inputs and judge details."""
  publicErrorMessage: String

  """Acceptance time as an ISO 8601 UTC timestamp."""
  createdAt: String!

  """Execution start as an ISO 8601 UTC timestamp; null until a worker starts."""
  startedAt: String

  """Completion time as an ISO 8601 UTC timestamp; present exactly when status is FINISHED."""
  finishedAt: String
}

enum SubmissionStatus {
  """Persisted and waiting for a worker."""
  QUEUED

  """A worker has started compilation or case execution."""
  RUNNING

  """Terminal state, including compilation, runtime, and infrastructure failures."""
  FINISHED
}

enum SubmissionVerdict {
  ACCEPTED
  WRONG_ANSWER
  COMPILE_ERROR
  RUNTIME_ERROR
  TIME_LIMIT_EXCEEDED
  MEMORY_LIMIT_EXCEEDED
  INTERNAL_ERROR
}
