interface ProblemFailure {
  message: String!
}

"""The mutation input is invalid. No changes were applied."""
type ProblemValidationFailure implements ProblemFailure {
  message: String!
  fieldErrors: [FieldError!]!
}

type FieldError {
  """Path within the mutation input, such as title, starterCode, or inputJson."""
  field: String!
  message: String!
}

"""The requested resource does not exist or is unavailable."""
type ProblemNotFound implements ProblemFailure {
  message: String!
}

"""Administrator access is required."""
type ProblemForbidden implements ProblemFailure {
  message: String!
}
