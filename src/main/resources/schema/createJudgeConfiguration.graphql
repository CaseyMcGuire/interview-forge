extend type Mutation {
  """
  Creates private judge settings for a problem language. Admins only.
  Use updateJudgeConfiguration if settings already exist.
  """
  createJudgeConfiguration(input: CreateJudgeConfigurationInput!): CreateJudgeConfigurationResult!
}

union CreateJudgeConfigurationResult =
    CreateJudgeConfigurationSuccess
  | ProblemValidationFailure
  | ProblemNotFound
  | ProblemForbidden

type CreateJudgeConfigurationSuccess {
  """The problem language with its new judge settings."""
  problemLanguage: ProblemLanguage!
}

input CreateJudgeConfigurationInput {
  """ID of the problem-language configuration to use."""
  problemLanguageId: ID!

  """Code that parses input, calls the solution, and serializes output. Nonblank; at most 50,000 characters."""
  testDriverCode: String!

  """Reference solution for custom inputs. Nonblank when provided; at most 50,000 characters."""
  referenceSolutionCode: String

  """
  Custom answer checker; required for custom checking and unavailable for exact JSON comparison.
  Nonblank when provided; at most 50,000 characters.
  """
  checkerSource: String

  """Maximum execution time per test case, from 1 to 60,000 milliseconds."""
  timeLimitMs: Int!

  """Maximum memory per test case, from 1 to 8,192 megabytes."""
  memoryLimitMb: Int!
}
