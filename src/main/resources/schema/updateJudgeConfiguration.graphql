extend type Mutation {
  """Updates private judge settings for a problem language. Admins only."""
  updateJudgeConfiguration(input: UpdateJudgeConfigurationInput!): UpdateJudgeConfigurationResult!
}

union UpdateJudgeConfigurationResult =
    UpdateJudgeConfigurationSuccess
  | ProblemValidationFailure
  | ProblemNotFound
  | ProblemForbidden

type UpdateJudgeConfigurationSuccess {
  judgeConfiguration: JudgeConfiguration!
}

"""
Omitted fields stay unchanged. Null clears checkerSource and referenceSolutionCode;
for other fields, null leaves the value unchanged.
"""
input UpdateJudgeConfigurationInput {
  """Opaque judge configuration ID returned by JudgeConfiguration.id."""
  id: ID!

  testDriverCode: String

  """
  Nonblank reference code, at most 50,000 characters.
  Omit to keep the current value; null clears it.
  """
  referenceSolutionCode: String

  """Custom answer checker; null clears it only when using exact JSON comparison."""
  checkerSource: String

  timeLimitMs: Int
  memoryLimitMb: Int
}
