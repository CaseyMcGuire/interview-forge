extend type Query {
  """Enabled programming languages, ordered by their stable key."""
  languages: [Language!]!

  """Published, unarchived problems ordered by title, then slug, with forward cursor pagination."""
  problems(
    """Maximum edges to return, from 0 to 100. Defaults to 20."""
    first: Int = 20
    """Continue after this opaque edge cursor, using the same filters."""
    after: String
    """Optional filters combined with AND."""
    filters: ProblemFilterInput
  ): ProblemConnection!

  """
  Finds a published, unarchived problem by its stable URL slug.
  Returns null when the problem does not exist or is unavailable to the viewer.
  """
  problem(slug: String!): Problem
}

input ProblemFilterInput {
  """Case-sensitive title substring. Surrounding whitespace is ignored; blank means no filter."""
  search: String

  """Only problems with this difficulty."""
  difficulty: ProblemDifficulty
}

type ProblemConnection {
  edges: [ProblemEdge!]!
  pageInfo: PageInfo!
}

type ProblemEdge {
  cursor: String!
  node: Problem!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""Public content needed to read a coding problem and start a solution."""
type Problem {
  """Opaque, globally unique problem identifier."""
  id: ID!

  """Stable URL identifier, such as two-sum."""
  slug: String!

  """Human-readable problem title."""
  title: String!

  """Markdown statement, including requirements and constraints."""
  statementMarkdown: String!

  """Difficulty displayed in the problem view and catalog."""
  difficulty: ProblemDifficulty!

  """Starter-code configurations for enabled languages, ordered by language key."""
  languageConfigurations: [ProblemLanguage!]!

  """Public example cases in ascending position order; never includes hidden tests."""
  examples: [ProblemExample!]!
}

"""Broad difficulty classification for a coding problem."""
enum ProblemDifficulty {
  EASY
  MEDIUM
  HARD
}

"""Public editor configuration for one problem and programming language."""
type ProblemLanguage {
  """Opaque, globally unique problem-language configuration identifier."""
  id: ID!

  """Programming language supported by this configuration."""
  language: Language!

  """Code stencil used to initialize or reset the editor."""
  starterCode: String!

  """
  Private judge settings for this configuration. Admins only: null for other viewers,
  and null until an admin creates the judge configuration.
  """
  judgeConfiguration: JudgeConfiguration
}

"""
Private execution settings for one problem-language configuration, edited in place.
Never visible to non-admin viewers.
"""
type JudgeConfiguration {
  """Opaque, globally unique judge configuration identifier."""
  id: ID!

  """Code that parses test input, calls the submitted solution, and serializes its output."""
  testDriverCode: String!

  """
  Private reference solution used to generate expected outputs for custom inputs.
  Null until configured. Its source uses this problem language's driver and execution settings.
  """
  referenceSolutionCode: String

  """Validator for problems with multiple valid answers; null unless the problem uses a custom checker."""
  checkerSource: String

  """Maximum execution time per test case, in milliseconds."""
  timeLimitMs: Int!

  """Maximum memory per test case, in megabytes."""
  memoryLimitMb: Int!
}

"""A programming language offered by the coding editor."""
type Language {
  """Opaque, globally unique language identifier."""
  id: ID!

  """Stable machine identifier, such as kotlin or python."""
  key: String!

  """Human-readable name shown in the language selector."""
  displayName: String!
}

"""An official example that may be shown before the problem is solved."""
type ProblemExample {
  """Opaque, globally unique example identifier."""
  id: ID!

  """Nonnegative ordering position within the problem's official test suite."""
  position: Int!

  """Serialized JSON input describing arguments or a constructor and call sequence."""
  inputJson: String!

  """
  Serialized JSON expected result or custom-checker reference data.
  The string "null" is a valid expectation, not a missing value.
  """
  expectedOutputJson: String!

  """Optional Markdown explanation of the example."""
  explanationMarkdown: String
}
