extend type Mutation {
  """Updates a published problem's title, statement, difficulty, or tags. Admins only."""
  updateProblem(input: UpdateProblemInput!): UpdateProblemResult!
}

union UpdateProblemResult =
    UpdateProblemSuccess
  | ProblemValidationFailure
  | ProblemNotFound
  | ProblemForbidden

type UpdateProblemSuccess {
  problem: Problem!
}

"""Fields omitted or set to null stay unchanged."""
input UpdateProblemInput {
  """ID of the problem to update."""
  id: ID!

  title: String
  statementMarkdown: String
  difficulty: ProblemDifficulty

  """Replaces the assigned tags. An empty list removes all tags."""
  tagIds: [ID!]
}
