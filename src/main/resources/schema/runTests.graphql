extend type Mutation {
  """
  Runs an authenticated user's source against public examples or custom cases for an
  enabled language on a published, unarchived problem. Returns the completed result
  in this response; no submission, inputs, or results are saved and there is no polling ID.
  Hidden tests are never selected.

  Compiles once and runs the ordered cases in one JVM, preserving state between cases
  and stopping at the first failure. Compilation and execution failures are returned
  in RunTestsSuccess; validation and admission failures prevent execution from starting.
  """
  runTests(input: RunTestsInput!): RunTestsResult!
}

union RunTestsResult =
    RunTestsSuccess
  | RunTestsValidationFailure
  | AuthenticationRequired
  | ProblemNotFound
  | ExecutionUnavailable
  | ExecutionBusy

input RunTestsInput {
  """
  Opaque ID returned by ProblemLanguage.id. The server selects the driver, runtime, and limits.
  Malformed, wrong-type, missing, or unavailable configuration IDs return ProblemNotFound.
  """
  problemLanguageId: ID!

  """Nonblank solution source, at most 50,000 characters. Preserved without trimming."""
  sourceCode: String!

  """
  Omit or provide null to run all current public examples in ascending position order
  with their stored expectations. An empty example suite or one exceeding 20 cases
  returns ExecutionUnavailable; examples are never silently truncated.

  A supplied list replaces the examples and runs in list order. It must contain 1 to 20
  cases; an empty list is invalid. Custom cases do not require any stored examples.
  """
  customCases: [CustomTestCaseInput!]
}

input CustomTestCaseInput {
  """Serialized JSON input, at most 20,000 characters when compactly serialized."""
  inputJson: String!

  """
  Optional serialized JSON expectation, at most 20,000 characters when compactly serialized.
  Omit or provide null to inspect output without checking correctness. The string "null"
  supplies a JSON null expectation and does enable comparison.
  """
  expectedOutputJson: String
}

"""The run finished. Its status describes the outcome, including compilation or execution failure."""
type RunTestsSuccess {
  status: TestRunStatus!

  """Number of selected cases, including cases not reached because the run failed."""
  totalCases: Int!

  """
  Results for cases that started, in execution order, including the first failure when
  its case is known. Remaining cases are not run and have no entries. Empty when
  compilation failed or execution failed before the first case started.
  """
  caseResults: [TestRunCaseResult!]!

  """Suite runtime in milliseconds, including JVM startup but excluding compilation; null if unavailable."""
  runtimeMs: Int

  """Safe failure explanation, at most 20,000 characters. Excludes private driver and infrastructure diagnostics."""
  publicErrorMessage: String
}

"""Output from one executed public example or custom case. Exists only in this response."""
type TestRunCaseResult {
  """Zero-based index in the selected case list, independent of stored example positions."""
  index: Int!

  """The input used for this case, serialized as JSON."""
  inputJson: String!

  """The expectation used for comparison, or null when no comparison was requested."""
  expectedOutputJson: String

  status: TestRunCaseStatus!

  """Captured stdout, at most 20,000 characters. May be empty or invalid JSON."""
  output: String!
}

"""Invalid source or custom-case input. Execution did not start."""
type RunTestsValidationFailure {
  message: String!

  """Paths identify input fields, such as sourceCode, customCases, or customCases[0].inputJson."""
  fieldErrors: [FieldError!]!
}

"""Terminal outcome of a transient run; never an official submission verdict."""
enum TestRunStatus {
  """All cases completed and every supplied expectation matched. Unchecked cases do not establish correctness."""
  COMPLETED
  WRONG_ANSWER

  """A case's output could not be parsed as JSON for comparison."""
  INVALID_OUTPUT
  COMPILE_ERROR
  RUNTIME_ERROR
  TIME_LIMIT_EXCEEDED
  MEMORY_LIMIT_EXCEEDED
  OUTPUT_LIMIT_EXCEEDED

  """Execution infrastructure failed after the run was admitted."""
  INTERNAL_ERROR
}

enum TestRunCaseStatus {
  """The output matched the supplied or stored expectation using exact JSON comparison."""
  PASSED

  """The case completed without an expectation; its output was not checked for correctness."""
  EXECUTED
  WRONG_ANSWER

  """The output could not be parsed as JSON for comparison."""
  INVALID_OUTPUT
  RUNTIME_ERROR
  TIME_LIMIT_EXCEEDED
  MEMORY_LIMIT_EXCEEDED
  OUTPUT_LIMIT_EXCEEDED

  """Execution infrastructure failed while this case was running."""
  INTERNAL_ERROR
}
