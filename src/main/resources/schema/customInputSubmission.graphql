extend type Query {
  """Returns the status and results of the signed-in user's custom input submission, or null if unavailable."""
  customInputSubmission(id: ID!): CustomInputSubmission
}

"""A submission against user-supplied inputs. Passing does not mark the problem as solved."""
type CustomInputSubmission {
  id: ID!
  status: CustomInputSubmissionStatus!

  """Overall result; null until FINISHED."""
  outcome: CustomInputSubmissionOutcome

  """Number of supplied test cases."""
  totalCases: Int!

  """Number of passed cases; zero until the run finishes."""
  passedCases: Int!

  """
  One result per supplied case, in input order; null until FINISHED.
  Includes NOT_RUN for cases that did not execute.
  """
  caseResults: [CustomInputSubmissionCaseResult!]

  """Submitted code execution time in milliseconds, excluding compilation and reference execution; null if unavailable."""
  runtimeMs: Int

  """User-facing failure explanation, at most 20,000 characters; null when not applicable."""
  publicErrorMessage: String

  """Creation time as an ISO 8601 UTC timestamp."""
  createdAt: String!

  """
  Preparation start as an ISO 8601 UTC timestamp; null while queued.
  Elapsed time to finishedAt includes preparation and differs from runtimeMs.
  """
  startedAt: String

  """Completion time as an ISO 8601 UTC timestamp; null until FINISHED."""
  finishedAt: String
}

"""Result for one supplied test case."""
type CustomInputSubmissionCaseResult {
  """Input and expected output for this case."""
  testCase: CustomTestCase!

  outcome: CustomInputSubmissionCaseOutcome!

  """Captured output, at most 20,000 characters. May be invalid JSON; empty for NOT_RUN."""
  output: String!

  """User-facing failure explanation; null when not applicable."""
  publicErrorMessage: String
}

type CustomTestCase {
  id: ID!

  """Zero-based position in the submitted input list."""
  position: Int!

  """The supplied input, serialized as JSON."""
  inputJson: String!

  """
  Expected output as JSON; null until available.
  The string "null" represents a JSON null value.
  """
  expectedOutputJson: String
}

enum CustomInputSubmissionStatus {
  QUEUED

  """Execution is in progress."""
  RUNNING
  FINISHED
}

enum CustomInputSubmissionOutcome {
  """All supplied cases passed."""
  PASSED
  WRONG_ANSWER
  INVALID_OUTPUT
  COMPILE_ERROR
  RUNTIME_ERROR
  TIME_LIMIT_EXCEEDED
  MEMORY_LIMIT_EXCEEDED
  OUTPUT_LIMIT_EXCEEDED

  """Expected outputs could not be generated."""
  REFERENCE_SOLUTION_FAILED
  INTERNAL_ERROR
}

enum CustomInputSubmissionCaseOutcome {
  PASSED
  WRONG_ANSWER

  """The case returned output that could not be parsed as JSON."""
  INVALID_OUTPUT
  RUNTIME_ERROR
  TIME_LIMIT_EXCEEDED
  MEMORY_LIMIT_EXCEEDED
  OUTPUT_LIMIT_EXCEEDED
  INTERNAL_ERROR

  """User code was not executed for this case."""
  NOT_RUN
}
