extend type Mutation {
  """Queues the signed-in user's solution against supplied test cases and returns a run ID for polling."""
  enqueueCustomTestSuiteRun(input: EnqueueCustomTestSuiteRunInput!): EnqueueCustomTestSuiteRunResult!
}

union EnqueueCustomTestSuiteRunResult =
    EnqueueCustomTestSuiteRunSuccess
  | EnqueueCustomTestSuiteRunValidationFailure
  | AuthenticationRequired
  | ProblemNotFound
  | ExecutionUnavailable
  | ExecutionBusy

type EnqueueCustomTestSuiteRunSuccess {
  """ID to poll with customTestSuiteRun(id) for status and results."""
  customTestSuiteRunId: ID!
}

input EnqueueCustomTestSuiteRunInput {
  """ID of the problem-language configuration to use."""
  problemLanguageId: ID!

  """Nonblank solution source, at most 50,000 characters."""
  sourceCode: String!

  """Ordered test inputs. At least one is required; the configured maximum defaults to 20."""
  cases: [CustomTestCaseInput!]!
}

input CustomTestCaseInput {
  """
  Serialized JSON input, at most 20,000 characters when compactly serialized.
  Expected outputs are computed automatically.
  """
  inputJson: String!
}

"""Invalid source or test cases. No run was queued."""
type EnqueueCustomTestSuiteRunValidationFailure {
  message: String!

  """Input paths such as sourceCode, cases, or cases[0].inputJson."""
  fieldErrors: [FieldError!]!
}
