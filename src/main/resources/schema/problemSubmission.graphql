extend type Query {
  """Returns the status and result of the signed-in user's official submission, or null if unavailable."""
  problemSubmission(id: ID!): ProblemSubmission
}

"""An official submission and its progress."""
type ProblemSubmission {
  """Opaque, globally unique identifier used for polling."""
  id: ID!

  status: ProblemSubmissionStatus!

  """Overall result; PENDING until execution finishes."""
  verdict: ProblemSubmissionVerdict!

  """Number of official test cases selected for this submission."""
  totalCases: Int!

  """Number of official cases passed so far."""
  passedCases: Int!

  """Execution time in milliseconds, excluding compilation; null if unavailable."""
  runtimeMs: Int

  """Highest available case memory measurement in megabytes; null if unavailable."""
  peakMemoryMb: Int

  """User-facing failure explanation, at most 20,000 characters; null when not applicable."""
  publicErrorMessage: String

  """Creation time as an ISO 8601 UTC timestamp."""
  createdAt: String!

  """Execution start as an ISO 8601 UTC timestamp; null before execution."""
  startedAt: String

  """Completion time as an ISO 8601 UTC timestamp; null until FINISHED."""
  finishedAt: String

  """
  First failed case, if it was a public example.
  Null when unavailable or when the first failure was hidden.
  """
  failedExample: ProblemSubmissionFailedExample
}

"""A public example that failed during the submission."""
type ProblemSubmissionFailedExample {
  """The example input serialized as JSON."""
  inputJson: String!

  """The expected answer serialized as JSON, including the literal null when that is the expected value."""
  expectedOutputJson: String!

  """Captured output, at most 20,000 characters; may be empty or invalid JSON."""
  output: String!
}

enum ProblemSubmissionStatus {
  """Waiting to execute."""
  QUEUED

  """Compilation or test execution is in progress."""
  RUNNING

  """Execution has completed, successfully or with an error."""
  FINISHED
}

enum ProblemSubmissionVerdict {
  """Execution has not finished yet."""
  PENDING

  """The solution passed all official tests."""
  ACCEPTED
  WRONG_ANSWER
  COMPILE_ERROR
  RUNTIME_ERROR
  TIME_LIMIT_EXCEEDED
  MEMORY_LIMIT_EXCEEDED
  INTERNAL_ERROR
}
