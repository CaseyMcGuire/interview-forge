extend type Mutation {
  """
  Queues the signed-in user's solution against the problem's official tests, including hidden cases.
  Poll the returned submission for status and results.
  """
  submitSolution(input: SubmitSolutionInput!): SubmitSolutionResult!
}

union SubmitSolutionResult =
    SubmitSolutionSuccess
  | SubmissionValidationFailure
  | AuthenticationRequired
  | ProblemNotFound
  | ExecutionUnavailable
  | ExecutionBusy

type SubmitSolutionSuccess {
  """Submission to poll for status and results."""
  submission: Submission!
}

input SubmitSolutionInput {
  """ID of the problem-language configuration to use."""
  problemLanguageId: ID!

  """Nonblank solution source, at most 50,000 characters."""
  sourceCode: String!
}

"""Invalid submission input. No submission was created."""
type SubmissionValidationFailure {
  message: String!
  fieldErrors: [FieldError!]!
}

"""Sign-in is required."""
type AuthenticationRequired {
  message: String!
}

"""Execution is unavailable for the selected problem-language configuration."""
type ExecutionUnavailable {
  """User-facing explanation."""
  message: String!
}

"""Execution capacity is full; retry later."""
type ExecutionBusy {
  message: String!
}
